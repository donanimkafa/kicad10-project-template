name: KiCad 10 Automation Pipeline

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: kicad/kicad:10.0
      options: --user root
      env:
        HOME: /home/kicad

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run KiCad automation
        id: build
        continue-on-error: true
        run: python3 scripts/build_docs.py

      - name: Upload manufacturing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KiCad-10-Manufacturing-Outputs
          path: manufacturing/
          if-no-files-found: warn

      - name: Mark build failed when automation reports errors
        if: steps.build.outcome == 'failure'
        run: exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download manufacturing artifacts
        uses: actions/download-artifact@v4
        with:
          name: KiCad-10-Manufacturing-Outputs
          path: manufacturing

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            manufacturing/*-Gerber-Drill.zip
            manufacturing/schematic/*.pdf
            manufacturing/assembly/*.pdf
            manufacturing/3d/*.step
            manufacturing/*-bom.csv
