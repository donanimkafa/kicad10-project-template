name: 'KiCad 10 Automation Pipeline'

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-documentation:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0  # KiCad 10 resmi Docker imajı

    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4

      - name: 'Run Custom Python Automation Script'
        run: python3 scripts/build_docs.py

      - name: 'Upload Manufacturing Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: KiCad-10-Manufacturing-Outputs
          path: manufacturing/

      - name: 'Create GitHub Release on Tag'
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            manufacturing/fabrication/*.zip
            manufacturing/schematic/*.pdf
            manufacturing/assembly/*.pdf
            manufacturing/assembly/*.step
            manufacturing/assembly/*.csv