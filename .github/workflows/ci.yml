name: KiCad 10 Automation Pipeline

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

# Aynı dal için eski çalışmayı iptal et; etiket (release) çalışmalarına dokunma.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # build_docs.py'nin tespit ettiği PHASE değeri release işine aktarılır.
    outputs:
      phase: ${{ steps.build.outputs.phase }}
    container:
      image: kicad/kicad:10.0
      options: --user root
      env:
        HOME: /home/kicad

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Tüm geçmiş ve etiketler gerekli: update_title_block.py
          # "git describe --tags" ile en yakın sürüm etiketini bulur.
          fetch-depth: 0

      - name: Git güvenli dizin ayarı
        # Konteyner root olarak çalışır, çalışma dizini ise runner kullanıcısına aittir.
        # Bu ayar olmadan git "dubious ownership" hatası verir ve başlık bloğu
        # revizyon/tarih bilgisi sessizce CHANGELOG'a düşer.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git --version

      - name: Run KiCad automation
        id: build
        continue-on-error: true
        run: python3 scripts/build_docs.py

      - name: Upload manufacturing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KiCad-10-Manufacturing-Outputs
          path: manufacturing/
          if-no-files-found: warn

      - name: Mark build failed when automation reports errors
        if: steps.build.outcome == 'failure'
        run: exit 1

  release:
    # Yalnızca v* etiketi VE şematikteki PHASE değeri "release" ise yayımlanır.
    if: startsWith(github.ref, 'refs/tags/') && needs.build-documentation.outputs.phase == 'release'
    needs: build-documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download manufacturing artifacts
        uses: actions/download-artifact@v4
        with:
          name: KiCad-10-Manufacturing-Outputs
          path: manufacturing

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            manufacturing/*-Gerber-Drill.zip
            manufacturing/schematic/*.pdf
            manufacturing/assembly/*.pdf
            manufacturing/3d/*.step
            manufacturing/*-bom.csv
