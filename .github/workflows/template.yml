name: KiCad Template Package

on:
  push:
    branches: [main]
    tags: ['template-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test input selection and template hierarchy
        run: python -B -m unittest discover -s tests -v
      - name: Build installable KiCad template
        run: python scripts/build_kicad_template.py
      - name: Upload template package
        uses: actions/upload-artifact@v4
        with:
          name: KiCad-10-User-Template
          path: manufacturing/templates/kicad10-project-template.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/template-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KiCad-10-User-Template
          path: package
      - name: Publish installable template
        uses: softprops/action-gh-release@v3
        with:
          name: KiCad Template ${{ github.ref_name }}
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Download kicad10-project-template.zip from Assets and extract its folder into KICAD_USER_TEMPLATE_DIR.
            In KiCad's new project dialog, select Donanimkafa - KiCad 10.
            For GitHub CI and Issue forms, use the repository's Use this template button.
          files: package/kicad10-project-template.zip
